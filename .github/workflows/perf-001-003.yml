name: perf-001-003-implementation
on:
  push:
    branches:
      - feature/perf-001-003-render-startup-20261010
      - feature/perf-render-telemetry-20261010
      - feature/perf-startup-yield-20261010
      - feature/perf-cooperative-scene-20261010
      - feature/perf-dwfx-scene-chunking-20261010
      - feature/perf-dwfx-renderer-wiring-20261010
      - feature/perf-mesh-buffer-chunks-20261010
      - feature/perf-normals-upload-20261010
      - feature/perf-progressive-gpu-20261010
      - feature/perf-mesh-profiling-reuse-20261010
      - feature/perf-dwfx-scene-revision-cache-20261010
      - feature/perf-scene-cache-lifetime-20261010
      - feature/perf-cache-disposal-hook-20261010
      - feature/perf-dwfx-revision-counters-20261010
      - feature/perf-dwfx-writer-revisions-20261010
      - feature/perf-dwfx-crossmodule-audit-20261010
      - feature/perf-browser-acceptance-evidence-20261010
  workflow_dispatch:
  pull_request:
    branches:
      - feature/mobile-viewport-mob001-20261010

jobs:
  core-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check PERF runtime, renderer, and browser tests
        run: |
          node --check src/import/dwfx/reference-scene-ui.js
          node --check src/domain/performance/render-startup.mjs
          node --check scripts/build-standalone.mjs
          node --check tests/browser/perf-001-003.spec.mjs
          node --check tests/browser/perf-001-redraw-timing.spec.mjs
          node --check tests/browser/perf-001-startup-longtasks.spec.mjs
          node --check tests/core/perf-dwfx-source-index.test.mjs
          node --check tests/core/perf-dwfx-project-wide-index.test.mjs
          node --check tests/core/perf-dwfx-inflight-mutation.test.mjs
      - name: Test frame coalescer and isolated startup
        run: node --test tests/core/perf-001-003.test.mjs
      - name: Test indexed DWFx scene rendering and cache reuse
        run: node --test tests/core/perf-dwfx-source-index.test.mjs
      - name: Test multi-scene DWFx source index
        run: node --test tests/core/perf-dwfx-project-wide-index.test.mjs
      - name: Test in-flight DWFx mutation and stale-scene recovery
        run: node --test tests/core/perf-dwfx-inflight-mutation.test.mjs
      - name: Run existing regression suite
        run: npm test
      - name: Verify full standalone build
        run: npm run build:standalone
      - name: Verify generated PERF runtime contract
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const html=fs.readFileSync('dist/TubeBender_CAD_VC207R7_M1_Standalone.html','utf8');
          assert.match(html,/window\.TubeBenderRenderPerformance/);
          assert.match(html,/window\.TubeBenderStartupStatus/);
          assert.match(html,/tbViewerFrameCoalescer\.schedule/);
          assert.ok(!html.includes("currentProjectCollisionAnalysis = getProjectCollisionAnalysis(activeProject());\n  safeUiCall('renderBoundsWarning', renderBoundsWarning);"));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: tubebender-perf-standalone
          path: dist/TubeBender_CAD_VC207R7_M1_Standalone.html
          if-no-files-found: error

  chromium-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build standalone under test
        run: npm run build:standalone
      - name: Verify PERF-001 and PERF-003 in Chromium
        run: npx playwright test --config acceptance/playwright.config.mjs --grep 'PERF-00[13]'
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-001-003-browser-evidence
          path: reports/browser
          if-no-files-found: warn
