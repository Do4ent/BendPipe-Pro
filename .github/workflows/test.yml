name: test

on:
  pull_request:
    branches:
      - ai/setup-agent-team
      - main
  push:
    branches:
      - feature/trusted-geometry-core

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: npm test
