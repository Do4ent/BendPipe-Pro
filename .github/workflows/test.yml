name: test

on:
  pull_request:
    branches:
      - ai/setup-agent-team
      - main
  push:
    branches:
      - feature/trusted-geometry-core

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run tests
        run: npm test
      - name: Build standalone HTML
        run: npm run build:standalone
      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: TubeBender-CAD-VC207R7-M1-Standalone
          path: dist/TubeBender_CAD_VC207R7_M1_Standalone.html
          if-no-files-found: error
