name: test

on:
  pull_request:
    branches:
      - ai/setup-agent-team
      - develop
      - main
  push:
    branches:
      - develop
      - feature/trusted-geometry-core

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run tests
        run: npm test
      - name: Build standalone HTML
        run: npm run build:release
      - name: Validate release HTML syntax
        run: |
          node scripts/check-standalone-syntax.mjs
          node scripts/check-standalone-syntax.mjs dist/BendPipe_Pro_CAD_Workspace.html
      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: TubeBender-CAD-VC207R7-M1-Standalone
          path: |
            dist/TubeBender_CAD_VC207R7_M1_Standalone.html
            dist/BendPipe_Pro_CAD_Workspace.html
            dist/README-RELEASE.txt
            dist/SHA256SUMS
          if-no-files-found: error
