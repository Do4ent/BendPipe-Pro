name: mob001-focused-browser
on:
  push:
    branches:
      - feature/mobile-viewport-mob001-20261010
  workflow_dispatch:

jobs:
  chromium-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test viewport CSS contract
        run: node --test tests/core/mobile-viewport.test.mjs
      - name: Build standalone
        run: npm run build:standalone
      - name: Test MOB-001 in Chromium
        run: npx playwright test --config acceptance/playwright.config.mjs --grep '\\[MOB-001\\]'
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mob001-focused-browser
          path: reports/browser
          if-no-files-found: warn
